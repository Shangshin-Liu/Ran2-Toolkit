- type: "公告消息"
  top: true
  title: "📢 新手操作導引上線！練功團、任務指南、配點模擬一看就會"
  createdAt: "2026-10-23T15:34:00Z"
  content: |
    # 📢 新手操作導引正式上線！

    親愛的玩家們，大家好！

    第一次使用練功團、任務指南或配點模擬，不知道該從哪裡開始嗎？我們為這三大功能加入了**「操作導引」**，用實際畫面的示意圖一步步帶你上手！

    ---

    ### 🌟 導引內容一覽

    - **⚔️ 練功團**：建立招募、如何參團、查看歷史紀錄。
    - **📜 任務指南**：勾選已完成任務、模糊搜尋、任務連動機制、任務詳情與脈絡，以及保存與匯入進度的方法。
    - **🛡️ 配點模擬**：選職業與技能加點、奧義模式混搭、總計需求與已學技能、分享配點、奧義轉職參考數值與我的技能庫。

    ### 💡 使用小技巧

    - 進入頁面時會自動顯示導引，之後也可以隨時點頁面上方的「操作導引」按鈕重新開啟。
    - 每一步都附有示意圖，可以左右滑動切換，點圖片還能放大查看細節。
    - 不想每次都自動顯示的話，勾選「不再主動顯示此功能導引」就好；導引內容更新時會再提醒你一次。

    歡迎大家打開導引看看，也許會發現一些以前沒注意到的好用功能！

    > *感謝大家對《亂2萬事通》長久以來的支持，若使用上有任何問題或建議，歡迎透過「📞 聯絡我們」告訴我們！*

- type: "更新歷程"
  top: false
  title: "⚡ v2.9.0 新手操作導引上線：三大功能導覽、多圖輪播與點圖放大檢視"
  createdAt: "2026-10-23T15:34:00Z"
  content: |
    ### 🧭 新手操作導引 (Tour Guide) 上線
    - **📖 三大功能導覽內容**：
      - 練功團（3 步）、任務指南（5 步）、配點模擬（5 步）皆附實際畫面示意圖，說明文字以 ①②③ 逐張對應圖片。
      - 各頁面標題列的「操作導引」按鈕可隨時重新開啟導引。
    - **🖼️ 多圖輪播與點圖放大**：
      - 示意圖支援多張輪播，可左右滑動（觸控或滑鼠拖曳）、點左右箭頭或圓點切換，最後一張再往後會無縫回到第一張。
      - 點圖片或右上角「放大」開啟全螢幕檢視，可左右切換圖片，再點一下放大至原始尺寸並拖曳查看細節，支援鍵盤 `←` `→` 與 `Esc`。
    - **📐 依螢幕自動調整版面**：
      - 導引視窗依螢幕高度與圖片比例放大顯示；說明文字較長或螢幕較矮（例如筆電）時自動縮小圖片，不用捲動就能看完整頁說明。
    - **🔔 顯示規則與防呆**：
      - 勾選「不再主動顯示此功能導引」後不再自動跳出；導引內容更新時會依版本號再自動顯示一次。
      - 從練功團招募或配點分享連結進入時不自動跳出，避免蓋住分享內容；切換頁面或按上一頁時自動關閉。
      - 置頂公告彈窗顯示中時，會等公告關閉後再顯示導引。
      - 練功團、配點模擬手機版標題列按鈕改為自動換行，避免按鈕被擠壓。

- type: "公告消息"
