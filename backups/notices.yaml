    # 📢 配點模擬器「技能級別」標示功能正式上線！

    親愛的玩家們，大家好！

    為了讓大家在進行技能配點或研究流派時能更精準對照招式階級，我們已於**「配點模擬器」**全面導入**技能級別（Degree）**資訊！

    ---

    ### 🌟 本次功能亮點

    - **技能詳細資訊一目了然**：點擊任意技能，於學習門檻區塊即可清楚查看該招式的「技能級別」，透過這個資訊讓你靈豬兌換不失誤(應該啦，有錯在和我說QQ)。
    - **已學技能清單全面標記**：無論是個人已學技能膠囊，或是點閱他人分享的配點連結，等級後方皆會同步呈現 `(級別: {級別數})`（例如：`Lv.9 (級別: 15)`）。
    - **全職業技能庫完整校正**：全遊戲 32 條技能樹、共 600 個技能之官方級別資料皆已全數建置並同步至雲端。

    歡迎大家前往體驗全新的配點介面，規劃出最適合你的完美技能配點！

    > *感謝大家對《亂2萬事通》長久以來的支持！*

