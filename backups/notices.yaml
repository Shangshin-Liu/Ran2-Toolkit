  title: "📢 任務指南全面改版！任務截圖自動辨識與進度追蹤新體驗上線"
  createdAt: "2026-10-18T13:46:00Z"
  content: |
    # 📢 任務指南全面改版正式上線！

    親愛的玩家們，大家好！

    為了讓大家在追蹤角色任務、規劃能力點與技能點獲取時更加便利省時，我們對**「任務指南」**進行了自上線以來最大規模的介面與功能翻新！

    不再需要手忙腳亂對照遊戲逐一勾選，全新的智能截圖辨識技術，將在數秒內替你完成任務盤點！

    ---

    ### 🌟 本次改版核心亮點

    - **📸 上傳已完成任務截圖，自動辨識與勾選**：
      - 支援單次拖拉或選取最多 **30 張**遊戲「已完成任務」清單截圖。
      - 搭載針對《亂2》遊戲點陣字型的專屬解碼引擎，**辨識速度低於 15 毫秒且精準零誤判**！
      - 解析文字支援多次累加去重與手動修改，確認後一鍵匯入自動勾選。
    - **🔗 前置與後續任務連鎖引導**：
      - 勾選未完成前置的任務時，自動跳出貼心提示並詢問是否一併連帶完成前置。
      - 取消勾選已有後續任務完成的項目時，同樣會提醒連鎖重置，避免任務脈絡混亂。
    - **🔍 即時關鍵字模糊搜尋**：
      - 於中間欄位頂部輸入關鍵字（如：`註冊`、`結界`、`地圖`），即時篩選並一鍵自動定位所屬分類與 NPC。
    - **⚡ 三欄式等高現代化佈局與視覺強化**：
      - 桌機版採左右等高對齊配置，NPC 清單精簡為俐落的 `完成數/總數` 進度顯示。
      - 當某分類或 NPC 的任務**100% 全數達成時，以顯眼的翠綠主題色高亮提示**，成就感滿分！
    - **☁️ 雲端同步與版本保護**：
      - 任務進度全面對接 Firebase 雲端同步，並具備覆蓋前二次確認警告與任務庫版本差異自動偵測機制。

    歡迎大家立即開啟【任務指南】體驗截圖辨識與全新排版！

    > *感謝大家對《亂2萬事通》長久以來的支持，若使用上有任何問題或建議，歡迎透過回報功能告訴我們！*

- type: "更新歷程"
  top: false
  title: "⚡ v2.8.0 任務指南全面改版：遊戲截圖點陣辨識、智慧前置連鎖與三欄式佈局升級"
  createdAt: "2026-10-18T13:46:00Z"
  content: |
    ### 📜 任務指南 (Tasks) 功能全面改版
    - **📸 截圖智能辨識與快速匯入**：
      - 新增「上傳已完成任務圖片」彈窗，支援拖拉或批次多選最多 30 張任務清單截圖，並具備解析進度百分比遮罩。
      - **亂2專屬點陣解碼器**：逆向解析遊戲 11-row 亮綠色點陣字型建立 493 字元碼表，單張解析 <15ms 且零誤判；非標準截圖自動 fallback 至 Tesseract 深度 OCR。
      - **模糊文字清洗引擎**：支援遺失括號修復（如 `誤門)` → `(聖門)`、`恩凰` → `鳳凰`）、限時詞與雜訊正規化，支援外部 OCR 文字貼上與去重累加。
      - **嚴格名稱匹配勾選**：匯入時僅勾選完全相符之任務，不擅自連帶未出現的前置任務，確保進度真實性。
      - 內建截圖範例彈窗，並修正視窗 z-index 重疊層級。
    - **🔗 前置/後續任務智慧連鎖提示**：
      - 勾選任務時，若有未完成的前置任務，自動彈出確認提示並可一鍵連帶標記完成。
      - 取消勾選任務時，若後續任務已標記為完成，自動彈出防呆警示並詢問是否一併重置。
    - **🔍 文字模糊搜尋與自動定位**：
      - 中間欄頂部新增任務搜尋輸入框，輸入關鍵字即時列出符合任務；點擊結果自動切換所屬分類、選取 NPC 並滾動至該任務詳情。
    - **🎨 三欄等高現代化視覺與排序優化**：
      - 桌機版實作三欄等高（680px）佈局，左右兩側邊界感與電競主題色層次優化。
      - 左側分類與 NPC 清單精簡為 `X/Y` 緊湊進度呈現；達成 100% 全數完成時以亮綠光暈顯眼提示。
      - NPC 任務清單導入三層權重排序：`接取等級 (低->高) -> 群組 ID (同群組緊鄰) -> 任務 ID`。
    - **☁️ 雲端同步與版本防護整合**：
      - 雲端任務庫切換至 Firebase，改採 `lastUpdated` 智慧快取比對，大幅減少進入頁面之網路頻寬與載入時間。
      - 上傳與下載同步皆加入覆蓋警告防呆提示；匯入或下載時自動校驗任務庫版本號，偵測到版本差異時即時跳出提醒。

- type: "更新歷程"
  top: false
  title: "📊 全站流量統計累進加總升級與讀寫效能優化"
  createdAt: "2026-10-16T17:32:00Z"
  content: |
    ### 網站流量統計 (Analytics) 架構與效能升級
    - **累進加總欄位擴充**：於後端 Google Sheet 統計表保留每日日期與單日拜訪紀錄外，新增「累計總次數」欄位（Running Total），逐日同步記錄全站總人次成長軌跡。
    - **極速查詢與倒序檢索**：將總瀏覽人次讀取機制由全表掃描加總優化為 `O(1)` 單一儲存格讀取，並改採由下往上倒序檢索當日紀錄，大幅縮短資料表增長後的回應耗時。
    - **防併發寫入與請求精簡**：GAS 後端導入 `LockService` 腳本鎖防止多人同時進站產生計數覆寫；前端進站統計改由單次請求直接取回最新總人次，消除重複查詢之雙倍延遲。

- type: "更新歷程"
  top: false
  title: "⚡ v2.7.2 配點模擬器已學技能雙排資訊升級與顯示偏好設定"
  createdAt: "2026-09-25T12:25:00Z"
  content: |
    ### 配點模擬器 (Simulator) 體驗升級
    - **技能膠囊雙排資訊與版面重構**：已學技能膠囊改採上下雙排顯示；第二排整合呈現「屬性、級別、學習等級、能力要求」，並具備動態排版能力（無屬性自動隱藏、多能力需求自動展開拆分）。
    - **顯示偏好控制項**：「已學技能一覽」與「配點分享預覽」加入三組即時控制開關，支援 LocalStorage 記憶設定：
      - **關閉詳細資訊**：隱藏第二排條件並自動切換為緊湊膠囊模式。
      - **關閉屬性特效**：停用冰/火/毒/電之專屬霓虹邊框與背景特效。
      - **關閉技能衝突提示**：停用增益效果衝突警示點與呼吸邊框提示。
    - **分享預覽衝突提示支援**：分享預覽清單同步加入效果群組衝突檢測機制，與主模擬器維持一致體驗。

