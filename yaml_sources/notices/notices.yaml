- type: "公告消息"
  top: true
  title: "📢 系統功能調整與架構精簡公告"
  createdAt: "2026-08-22T18:50:00Z"
  content: |
    # 📢 萬事通系統功能調整公告

    親愛的玩家們，大家好！

    為了提供更穩定且可持續維護的服務，我們近期針對系統架構進行了全面評估與調整。

    ---

    ### 🛠️ 大項目功能調整說明
    我們已正式移除以下兩大功能：
    - **【好物交易】**（原 `/share` 玩家虛寶市集）
    - **【禮盒查詢】**（原 `/boxes` 禮盒掉率與內容物查詢）

    由於上述功能涉及較為複雜的資料結構、雲端營運維護成本與相關複雜問題，已超出目前個人開發與長期維護的可行範圍。因此我們決定先將其下架，並將選單網址保留為 **【構思中】**（`/function1` 與 `/function2`）虛位以待。

    ---

    ### 💡 歡迎分享你的 Idea 與想法！
    舊的功能告一段落，也代表全新功能的起點！如果您對於這兩個虛位以待的【構思中】版塊有任何**有趣的點子、實用的攻略工具需求或改進想法**，非常歡迎點擊首頁頂部的 **「📞 聯絡我們」** 功能將您的想法分享給我們！

    > *感謝大家對《亂2萬事通》長久以來的支持與體諒！*

- type: "更新歷程"
  top: false
  title: "🛠️ 移除「好物交易」與「禮盒查詢」功能並調整路由"
  createdAt: "2026-08-22T18:50:00Z"
  content: |
    ### 系統架構與功能精簡
    - **功能正式下架**：移除「好物交易」與「禮盒查詢」相關前端頁面組件、單元測試、靜態資料檔及後端背景自動化巡檢邏輯。
    - **路由與選單調整**：原好物交易 (`/share`) 變更為 `/function1`，原禮盒查詢 (`/boxes`) 變更為 `/function2`，頂部導覽列與首頁選單名稱統一顯示為【構思中】。
    - **維護機制對應**：新路由預設開啟維護狀態攔截，並顯示「此功能虛位以待」與專屬說明訊息。
    - **雲端資料清理**：清理 Firestore 資料庫中 `shares`、`applications`、`shops`、`favorites` 與 `boxes` 集合，並移除關聯的安全性規則與複合索引。

